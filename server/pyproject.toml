[project]
name = "splatworld"
version = "0.1.0"
description = "Runs a splatworld: the database, the API and the file store, on one machine."
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    # Its wheels carry their own GDAL, which is why elevation import needs
    # nothing installed by hand. Only `splatworld import` loads it.
    "rasterio>=1.3",
]

[project.scripts]
splatworld = "splatworld.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["splatworld*"]
