# The processes Invariant 10 allows: postgres, postgrest, nginx, geoserver, and
# since PLAN-money.md the world's cash — the issuer with the bank it reads
# from (`cash`), and walletd. None of them computes anything for the world:
# every atom runs in a browser, and walletd carries out only what the holder
# of a wallet asked (Invariant 9).
name: splatworld

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:-splatworld}
    command:
      - postgres
      - -c
      - app.jwt_secret=${JWT_SECRET:?set JWT_SECRET in .env}
    # Loopback only: the defaults in .env.example are not secrets, and players
    # connect to this database with logins of their own (db/0065_playerroles).
    # Only the file store (8081) faces the world; put a TLS proxy in front of
    # it and of PostgREST for anything public.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI:-postgres://authenticator:authenticator@db:5432/splatworld}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-api}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-anon}
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PGRST_SERVER_PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"

  # Immutable file store. The official nginx image is built --with-http_dav_module,
  # which is all PUT needs; auth_request delegates every write to rpc/can_write.
  files:
    image: nginx:1.27-alpine
    depends_on:
      - postgrest
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${FILES_ROOT:-./infra/files}:/srv/files
      - ./client:/srv/client:ro
    ports:
      - "8081:80"

  # The operator's elevation, over WCS, and nothing else (Invariant 9): QGIS
  # connects to the database as the player (SPEC §2.11), so this no longer
  # needs to reach Postgres at all.
  geoserver:
    image: docker.osgeo.org/geoserver:2.26.0
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?set GEOSERVER_ADMIN_PASSWORD in .env}
      SKIP_DEMO_DATA: "true"
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - geoserver-data:/opt/geoserver_data

  # PLAN-money.md §1: GNU Taler's issuer and libeufin-bank, one currency, no
  # fees. Each keeps a database of its own on the same Postgres server.
  cash:
    build:
      context: .
      dockerfile: infra/taler/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TALER_HOME: /data/taler
      TALER_BIND: 0.0.0.0
      TALER_CURRENCY: ${TALER_CURRENCY:-PLANETB}
      TALER_EXCHANGE_URL: http://cash:${TALER_EXCHANGE_PORT:-8091}/
      TALER_BANK_URL: http://cash:${TALER_BANK_PORT:-8092}/
      TALER_ISSUER_PASSWORD: ${TALER_ISSUER_PASSWORD:-issuer-password}
      TALER_EXCHANGE_BANK_PASSWORD: ${TALER_EXCHANGE_BANK_PASSWORD:-exchange-password}
    ports:
      - "127.0.0.1:${TALER_EXCHANGE_PORT:-8091}:${TALER_EXCHANGE_PORT:-8091}"
    volumes:
      - cash-data:/data

  # Keeps each wallet item's cash (server/splatworld/walletd.py).
  walletd:
    build:
      context: .
      dockerfile: infra/taler/Dockerfile
    restart: unless-stopped
    depends_on:
      - cash
    command: ["splatworld", "walletd"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${PGDATABASE:-splatworld}
      WALLETD_HOME: /data/walletd
      TALER_EXCHANGE_URL: http://cash:${TALER_EXCHANGE_PORT:-8091}/
      TALER_BANK_URL: http://cash:${TALER_BANK_PORT:-8092}/
      TALER_ISSUER_PASSWORD: ${TALER_ISSUER_PASSWORD:-issuer-password}
    volumes:
      - walletd-data:/data

volumes:
  db-data:
  geoserver-data:
  cash-data:
  walletd-data:
