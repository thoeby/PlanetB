# Four processes, no more (Invariant 10): postgres, postgrest, nginx, geoserver.
# None of them computes anything for the world — every atom runs in a browser.
name: splatworld

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:-splatworld}
    command:
      - postgres
      - -c
      - app.jwt_secret=${JWT_SECRET:?set JWT_SECRET in .env}
    # Loopback only: the geoserver login role has BYPASSRLS and the defaults in
    # .env.example are not secrets. Only the file store (8080) faces the world;
    # put a TLS proxy in front of it and of PostgREST for anything public.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI:-postgres://authenticator:authenticator@db:5432/splatworld}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-api}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-anon}
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PGRST_SERVER_PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"

  # Immutable file store. The official nginx image is built --with-http_dav_module,
  # which is all PUT needs; auth_request delegates every write to rpc/can_write.
  files:
    image: nginx:1.27-alpine
    depends_on:
      - postgrest
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${FILES_ROOT:-./infra/files}:/srv/files
      - ./client:/srv/client:ro
    ports:
      - "8080:80"

  # Admin/visualisation only (Invariant 9). QGIS talks WFS-T to this, never the client.
  geoserver:
    image: docker.osgeo.org/geoserver:2.26.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?set GEOSERVER_ADMIN_PASSWORD in .env}
      SKIP_DEMO_DATA: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - geoserver-data:/opt/geoserver_data

volumes:
  db-data:
  geoserver-data:
