# Immutable file store. nginx serves bytes and asks PostgREST whether a PUT is
# allowed; it computes nothing and knows nothing about the world (Invariant 9).
worker_processes 1;
events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types { model/gltf-binary glb; }

    sendfile      on;
    server_tokens off;
    client_max_body_size 512m;

    upstream api { server postgrest:3000; }

    server {
        listen 80;
        root /srv/files;

        location = /healthz { return 200 "ok\n"; }

        # auth_request takes no variables, so writes are bounced into @put and
        # only that branch is authorised. Reads stay public and unauthenticated.
        location = /auth {
            internal;
            proxy_pass http://api/rpc/can_write?path=$request_uri&sha256=$http_x_sha256&bytes=$http_content_length;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Accept "application/json";
        }

        location ~ ^/(assets|tiles|jobs|geo)/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            error_page 418 = @put;
            if ($request_method = PUT) { return 418; }
        }

        location @put {
            # Invariant 1: a path is written once. Overwriting is a conflict,
            # not an update, and nginx can answer that without asking anyone.
            if (-f $request_filename) { return 409; }

            auth_request /auth;
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:r all:r;
        }
    }
}
