# Immutable file store. Fleshed out in WP0.10 (auth_request -> rpc/can_write).
worker_processes 1;
events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    server {
        listen 80;
        root /srv/files;

        location / {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
