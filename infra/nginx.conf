# Immutable file store. nginx serves bytes and asks PostgREST whether a PUT is
# allowed; it computes nothing and knows nothing about the world (Invariant 9).
worker_processes 1;
events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types { model/gltf-binary glb; }

    sendfile      on;
    server_tokens off;
    client_max_body_size 512m;

    upstream api { server postgrest:3000; }

    # WP5.5: a write costs an auth_request and a file; a read costs a sendfile.
    # So only writes are limited, and generously — an atom uploads a handful of
    # files at once and a box compiling tiles is many tabs behind one address.
    limit_req_zone $binary_remote_addr zone=put:10m rate=20r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=putconn:10m;

    server {
        listen 80;
        root /srv/files;

        location = /healthz { return 200 "ok\n"; }

        # auth_request takes no variables, so writes are bounced into @put and
        # only that branch is authorised. Reads stay public and unauthenticated.
        location = /auth {
            internal;
            proxy_pass http://api/rpc/can_write?path=$request_uri&sha256=$http_x_sha256&bytes=$http_content_length;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Accept "application/json";
        }

        # The store is a public, immutable file service and the tab that works
        # for it is served from somewhere else, so reads and uploads are both
        # cross-origin. The token still decides every write: auth_request below.
        location ~ ^/(assets|tiles|jobs|geo)/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, PUT, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Sha256" always;
            add_header Access-Control-Max-Age 86400 always;
            if ($request_method = OPTIONS) { return 204; }
            error_page 418 = @put;
            if ($request_method = PUT) { return 418; }
        }

        location @put {
            limit_req zone=put burst=100 nodelay;
            limit_conn putconn 32;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Sha256" always;
            # Invariant 1: a path is written once. Overwriting is a conflict,
            # not an update, and nginx can answer that without asking anyone.
            if (-f $request_filename) { return 409; }

            auth_request /auth;
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:r all:r;
        }
    }
}
