## PostgREST — the only API. Compose passes the same values as PGRST_* env vars.
db-uri = "$(PGRST_DB_URI)"
db-schemas = "api"
db-anon-role = "anon"
db-pool = 10

## HS256, same secret the database signs with in login().
jwt-secret = "$(JWT_SECRET)"

server-port = 3000
server-host = "*"
db-max-rows = 10000
