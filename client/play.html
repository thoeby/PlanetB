<!doctype html>
<meta charset="utf-8">
<title>splatworld</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Endpoints, so the same static files run against compose or a dev box. -->
<meta name="splatworld:api" content="http://localhost:3000">
<meta name="splatworld:files" content="http://localhost:8080">
<link rel="stylesheet" href="./hud.css">
<link rel="stylesheet" href="./frame.css">
<link rel="stylesheet" href="./bar.css">
<link rel="stylesheet" href="./top.css">
<link rel="stylesheet" href="./panel.css">
<link rel="stylesheet" href="./panels.css">
<style>
  /* Only what a module's own markup needs and hud.css cannot know about. */
  .work-progress { white-space: pre-line; font-size: 12px; margin: 4px 0; }
  .work-log { margin: 6px 0 0; color: var(--ink-3); font-size: 11px;
    font-family: var(--mono); white-space: pre-wrap; max-height: 7rem;
    overflow-y: auto; }
  .work-bg, .build-on, .build-snap, .wallet-bounty, .area-add, .area-acts,
  .area-grant, .build-gizmo, .build-acts { display: flex; gap: 6px;
    align-items: center; margin: 6px 0; }
  .work-bg input, .build-on input, .build-snap input { width: auto; }
  .work-tiles, .build-assets, .build-tiles, .wallet-ledger, .area-list,
  .area-granted, .area-proposals { max-height: 9rem; overflow-y: auto; }
  .work-tile, .build-tile, .build-asset, .area-item, .area-grant {
    display: flex; gap: 6px; align-items: baseline; }
  .work-tile button, .build-tile button, .build-asset button,
  .area-item button, .area-grant button, .area-acts button,
  .wallet-bounty button { flex: 0 0 auto; padding: 3px 8px; font-size: 11px; }
  .wallet-line { font-family: var(--mono); font-size: 11px; }
  .wallet-delta { display: inline-block; min-width: 3.5rem; text-align: right; }
  .build-axis { font-family: var(--mono); color: var(--ink-3); }
  .area-item[data-on="1"] button { border-color: var(--accent); }
  .area-proposal { border: 1px solid var(--edge); padding: 6px 8px; margin: 6px 0; }
  .area-op { font-family: var(--mono); font-size: 11px; }
  .area-rules input, .wallet-amount { width: 5rem; }
  .auth-who { display: flex; gap: 8px; align-items: baseline; }
  .auth-buttons { display: flex; gap: 6px; margin-top: 8px; }
  .auth-status, .work-gpu, .work-state, .auth-role { color: var(--ink-3);
    font-size: 12px; }
  .auth-status[data-bad="1"] { color: var(--bad); }
  #xr { margin-top: 10px; }
</style>

<canvas id="view"></canvas>

<!-- PlayCanvas 2.x, pinned. The browser tests route this URL to the copy
     `make vendor` puts under client/vendor/, so they run without a network. -->
<script>
  // The copy `make vendor` puts in client/vendor/playcanvas/ first, the CDN
  // second — the same two-step view.html uses. Loading only from the CDN left
  // this page with no world and no message on a machine with no network.
  window.__pcReady = new Promise((resolve, reject) => {
      const add = (src, onFail) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = onFail;
          document.head.appendChild(s);
      };
      add('./vendor/playcanvas/playcanvas.js',
          () => add('https://code.playcanvas.com/playcanvas-2.22.0.js', reject));
  });
</script>

<script type="module">
  import * as api from './js/api.js';
  import * as tm from './lib/tilemath.js';
  import { mountAuth } from './js/auth.js';
  import { FloatingOrigin } from './js/origin.js';
  import { LIMITS, TileStreamer, WEBGL_LIMITS, cameraState } from './js/tiles.js';
  import { Player, Terrain, WALK } from './js/player.js';
  import { mountWork } from './js/workui.js';
  import { SpotChecker } from './js/spot.js';
  import { mountBuild } from './js/buildui.js';
  import { mountAreas } from './js/areasui.js';
  import { mountWallet } from './js/walletui.js';
  import { mountProfile } from './js/profileui.js';
  import { nearbyInstances } from './js/build.js';
  import { InstancePreview } from './js/preview.js';
  import { XR_LIMITS, teleportTarget, xrRequested, xrSupported } from './js/xr.js';
  import { mountHud, whatIsMissing } from './js/hud.js';
  import { mountNextStep } from './js/nextstep.js';
  import { drawMinimap } from './js/hudmap.js';
  import { mountSetup } from './js/setupui.js';
  import { mountAdmin } from './js/adminui.js';
  import { mountRules } from './js/rulesui.js';
  import { mountCatalogPanel } from './js/catalogpanel.js';
  import { drawAreas, labelAreas, labelObjects, mountLand, ringsOf } from './js/land.js';
  import { mountGetLand } from './js/getland.js';
  import { mountAssignLand } from './js/assignland.js';
  import { mountAttention } from './js/attention.js';
  import { mountPlaces, sameSpot } from './js/places.js';
  import { mountPool, mountSubmit } from './js/pool.js';
  import { mountFlows } from './js/flowsui.js';
  import { mountPermission } from './js/permission.js';
  import { mountShare, nearestGround, parseVisit, visitHash } from './js/visit.js';
  import { mountSky } from './js/sky.js';
  import { DemFloor } from './js/floor.js';
  import { DemGround } from './js/ground.js';

  api.configure();

  // The chrome first: it owns the tabs, and every module below is mounted into
  // one of them. Nothing is reachable by a key nobody told you about.
  const hud = mountHud(document);
  const world = document.createElement('p');
  world.id = 'world';
  world.className = 'muted mono';
  const panelFor = (tab, id) => {
      const host = document.createElement('div');
      host.id = id;
      hud.panel(tab).append(host);
      return host;
  };
  // The same, into what a surface says above its parts rather than into one
  // of them: Work's machine strip is true of every queue behind it.
  const headFor = (tab, id) => {
      const host = document.createElement('div');
      host.id = id;
      hud.panelHead(tab).append(host);
      return host;
  };
  try {
      await window.__pcReady;
  } catch {
      world.textContent = 'could not load the 3D engine — no network, and '
          + 'client/vendor/playcanvas is missing. Run `make vendor` once.';
      throw new Error('PlayCanvas did not load');
  }

  // The work panel lists the dirty tiles of whoever is signed in, so it is
  // re-read every time that changes.
  // WP5.2: the panel needs two things from the renderer — how long a frame is
  // taking, so background work can stand aside while the tab is being played,
  // and where the player is, so the nearest unfinished tile is claimed first.
  const frame = { ms: 0 };
  // Set by the Automate view: while it is open the world is not drawn at all.
  let paused = false;
  const work = mountWork(headFor('Work', 'work'), {
    frames: () => frame.ms,
    where: () => {
      const p = camera.getPosition();
      const g = origin.geodeticOf({ x: p.x, y: p.y, z: p.z });
      return { lon: g.lon, lat: g.lat };
    },
  });

  // SPEC §3.12: a render this tab is holding goes back into the pool when the
  // tab goes away, rather than sitting in nobody's hands until the five-minute
  // expiry notices (db/0079_worktakenandgivenback.sql). pagehide, not unload:
  // unload never fires on a tab restored from the back-forward cache.
  addEventListener('pagehide', () => { work.loop()?.handBack(); });

  // Where the world is. Until somebody picks a coverage there is nowhere to
  // stand, and the Setup panel is what the tab opens on (T0).
  const ground = await api.rpc('ground').catch(() => ({}));
  const setup = mountSetup(hud.panel('Setup'), {
      // Onto the world, not back to where the crosshair was pointing while
      // there was no world: an empty page writes #at=0,0 into the address bar,
      // and reloading with it carried the operator to null island the moment
      // they picked their ground (SPEC §3.1 step 3).
      onGround: () => { location.replace(location.pathname); },
  });
  // What the world may say about itself. The same rows drive this tool's forms,
  // QGIS's layer forms and the rules the compiler matches on (T3).
  // What the streamer is doing, under the three steps it is the result of.
  hud.panel('Setup').append(world);
  // SPEC §3.2: land is assigned by an admin, who draws it on the map here.
  // First in the panel, because it is the only thing in it that somebody else
  // is waiting for.
  const assignLand = mountAssignLand(hud.panel('Land'), { filesUrl: api.endpoints().files });
  const admin = mountAdmin(hud.panel('Vocabulary'));
  // The other half of the vocabulary: what the compiler makes of a thing that
  // carries those properties. It was a page of its own until T9.
  const rules = mountRules(hud.panel('Vocabulary'));
  // Who you are, in the corner, from the moment the page knows.
  const showWho = () => hud.signedIn(api.claims()?.email
      ?? (api.userId() ? 'signed in' : null));
  // SPEC §2.1 and §2.15: what is waiting for you, and one click to the thing.
  const attention = mountAttention(hud.waitingSlot(), {
      openPanel: (name) => hud.show(name),
      onChange: () => {
          assignLand.refresh();
          land.refresh();
          permission.refresh();
          // The ground under you can become yours while you stand still, so
          // the answer that was cached until you walked somewhere else is not
          // the answer any more.
          asked = { lon: 0, lat: 0, at: 0 };
      },
      onGo: (at) => {
          const p = origin.localOf({ lon: at.lon, lat: at.lat, h: 0 });
          player.position = { x: p.x, y: p.y + 2, z: p.z };
      },
  });
  // The catalog: what anybody may build with, and where you register your own.
  const catalog = await mountCatalogPanel(hud.panel('Catalog'));
  if (!ground?.coverage) hud.show('Setup');

  // Reading tiles needs no token: everyone reads the world (db/0003_rls.sql).
  // Every row is fetched, not only the published ones — the traversal has to
  // tell an unpublished child from one that does not exist.
  const rows = await api.selectAll('tile', {
    select: 'z,x,y,dirty,published_version,sog_sha256,manifest,'
      + 'candidate_version,candidate_sha256,candidate_manifest',
    order: 'z,x,y',
  }).catch((err) => {
    world.textContent = `api unreachable (${api.endpoints().api}): ${err.message}`;
    return [];
  });

  const live = rows.filter((r) => r.published_version > 0 && r.manifest?.origin);
  const anchor = (live.find((r) => r.z === 10) ?? live[0])?.manifest.origin
    ?? (ground?.centre ? { ...ground.centre, h: 0 } : { lon: 0, lat: 0, h: 0 });
  const origin = new FloatingOrigin(anchor);

  // WebGPU where the browser has it, WebGL2 otherwise. The difference is not
  // cosmetic: with WebGL2 the engine sorts every splat on the CPU and reads
  // each new tile's centres back from the GPU synchronously, which is the
  // stall felt whenever a tile lands. With WebGPU both happen on the device.
  // A headset session stays on WebGL2, the path the engine's XR is built on.
  const wantsXr = xrRequested(location.search);
  const canvas = document.getElementById('view');
  // A WebGPU adapter that is a software renderer (SwiftShader, which is what
  // a runner with no GPU has once --enable-unsafe-webgpu is on) takes the
  // renderer process down with it the moment the engine makes a device on
  // it: "A valid external Instance reference no longer exists", and the
  // page is gone before its first frame. Such a tab draws on WebGL2, which
  // ANGLE over SwiftShader does render. The trainer, which needs WebGPU for
  // its compute, makes its own device in its own worker and is not affected.
  const softwareGpu = async () => {
    const adapter = await navigator.gpu?.requestAdapter?.().catch(() => null);
    const info = adapter?.info ?? {};
    return /swiftshader|software|llvmpipe|lavapipe/i.test(
      `${info.architecture ?? ''} ${info.device ?? ''} ${info.description ?? ''}`);
  };
  const noWebgpu = wantsXr || await softwareGpu();
  const device = await pc.createGraphicsDevice(canvas, {
    deviceTypes: noWebgpu ? [pc.DEVICETYPE_WEBGL2] : [pc.DEVICETYPE_WEBGPU, pc.DEVICETYPE_WEBGL2],
    antialias: false, powerPreference: 'high-performance', xrCompatible: Boolean(navigator.xr),
  });
  const app = new pc.Application(canvas, { graphicsDevice: device });
  app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
  app.setCanvasResolution(pc.RESOLUTION_AUTO);

  const camera = new pc.Entity('camera');
  camera.addComponent('camera', {
    fov: 45, nearClip: 0.3, farClip: 5e7,
    clearColor: new pc.Color(0.05, 0.06, 0.07),
  });
  camera.setPosition(0, 2000, 0);
  camera.setEulerAngles(-90, 0, 0);            // straight down until the player takes over
  app.root.addChild(camera);
  // The sky and the air (client/js/sky.js): the viewer's, not the tiles'. A
  // sky that cannot be drawn is a sky the page goes on without.
  let sky = { follow() {} };
  try { sky = mountSky(app, pc, camera); } catch (err) { console.error('sky', err); }

  // WP1.5: the loaded tiles are re-checked every 30 s, and so is whatever was
  // published since the last check — a tile trained while this page is open
  // is what the parent refines into next. PostgREST takes the set as one
  // `or=(...)` filter, so it is one request however many tiles are on screen.
  const fetchRows = (loaded, since) => api.select('tile', {
    select: 'z,x,y,published_version,sog_sha256,manifest,'
      + 'candidate_version,candidate_sha256,candidate_manifest',
    or: `(${[...loaded.map((t) => `and(z.eq.${t.z},x.eq.${t.x},y.eq.${t.y})`),
      `published_at.gt.${encodeURIComponent(since)}`].join(',')})`,
  });

  // WP5.4: a headset draws the world twice at ninety frames a second, so
  // ?xr=1 halves the tile count and takes a third of the splats (js/xr.js).
  // The budget is lowered by the flag rather than by the session, because the
  // tiles have to be loaded before there is anything to enter. Without a
  // headset the budget follows the device (traverse.js WEBGL_LIMITS).
  const limits = wantsXr ? XR_LIMITS : device.isWebGPU ? LIMITS : WEBGL_LIMITS;
  const streamer = new TileStreamer(app, pc, {
    origin, filesUrl: api.endpoints().files, fetchRows, limits,
  });
  streamer.setTiles(rows);
  streamer.startPolling();

  // WP3.3: the tab re-checks the tiles it is looking at but did not publish.
  // It sweeps whether or not anyone is signed in — spot_due answers nothing to
  // an anonymous tab — and never while the work panel has an atom in hand.
  const spot = new SpotChecker({
    api, apiUrl: api.endpoints().api, filesUrl: api.endpoints().files, log: work.log,
  });
  spot.start(streamer, { busy: () => Boolean(work.loop()?.atom) });

  // The floor is the finest published tile's height file, and where nothing
  // is published yet, the elevation itself (client/js/floor.js): read, not
  // drawn. Every z14 tile of the ground is compiled (db/0104), so the second
  // is only ever a stopgap.
  const floor = ground?.coverage ? new DemFloor({ filesUrl: api.endpoints().files }) : null;
  const terrain = new Terrain(streamer, { ground: floor });
  // SPEC §0.1: ground is always drawn. Where no published tile covers it,
  // the same elevation is drawn as plain terrain (client/js/ground.js).
  const groundMesh = floor ? new DemGround(app, pc, { origin, floor, tiles: streamer.tiles }) : null;
  const player = new Player(terrain, { mode: WALK });
  // The corner says which way you are moving and what the keys do about it:
  // Shift runs on the ground and goes down in the air, and forward follows
  // where you are looking only in the air.
  player.onMode = (mode) => hud.moving(mode);
  hud.moving(player.mode);
  const view = document.getElementById('view');
  player.attach(view);

  // T8: a link is a place. Somebody sent this address because of what is at
  // that spot, so the page opens there rather than wherever the anchor is.
  // SPEC §3.8: a link outside the coverage arrives at the nearest ground and
  // says so, rather than at a place with no ground, no tile and nothing to see
  // — which looks like a broken page rather than a link to nowhere.
  const goTo = ({ lat, lon, h = 0, heading }) => {
      // Somebody has just said where to be. Stop writing over the address bar
      // for a moment: pasting a link into a tab that is already open changes
      // the hash, and the browser delivers that change a tick later — long
      // enough for this page to have replaced it with where the player still
      // is, which is how a pasted link went nowhere at all.
      stampAfter = Date.now() + HANDED_OVER_MS;
      const at = nearestGround({ lon, lat }, ground);
      if (at.moved) arriving('that place is off the edge of the world');
      const q = origin.localOf({ lon: at.lon, lat: at.lat, h });
      const under = terrain.heightAt(q);
      player.position = { x: q.x, y: (under ?? q.y) + 2, z: q.z };
      if (Number.isFinite(heading)) player.heading = heading;
  };

  // How long the page leaves the address bar alone after being handed one.
  const HANDED_OVER_MS = 3000;
  let stampAfter = 0;

  // Something about arriving somewhere, which stands for a while and then gives
  // the line back to whatever the world is missing.
  let arrival = { text: '', until: 0 };
  const arriving = (text) => {
      arrival = { text, until: Date.now() + 20000 };
      hud.notice(text);
  };
  const arrivedAt = parseVisit(location.href);
  if (arrivedAt) goTo(arrivedAt);
  // T8: a link is a place, and pasting one into the tab you already have open
  // is the same link. Without this it only worked on a fresh load, because
  // changing the hash does not reload anything.
  window.addEventListener('hashchange', () => {
      const to = parseVisit(location.href);
      if (to) goTo(to);
  });

  // WP4.2: build mode. The preview draws what has been placed but not yet
  // compiled — a published tile is splats, and a bench put down a second ago is
  // in none of them until some tab renders that tile again.
  const preview = new InstancePreview(app, pc, {
    origin, filesUrl: api.endpoints().files,
  });

  // An instance row plus the digest of the asset's canonical GLB, which is what
  // both the preview and `assemble` actually draw.
  async function nearby(lon, lat) {
    const rows = await nearbyInstances(lon, lat).catch(() => []);
    if (!rows.length) return rows;
    const sans = [...new Set(rows.map((r) => r.san))];
    const assets = await api.select('asset',
      { san: `in.(${sans.join(',')})`, select: 'san,sha256' }).catch(() => []);
    const bySan = new Map(assets.map((a) => [a.san, a.sha256]));
    return rows.filter((r) => bySan.has(r.san))
      .map((r) => ({ ...r, sha256: bySan.get(r.san) }));
  }

  // WP4.4: the wallet, and the bounty that puts a tile in front of a stranger.
  // Whatever the wallet learns, the corner of the chrome says — so a balance
  // that changed because a bounty was paid does not wait for a sign-in.
  let held = null;
  let profile = null;
  const wallet = mountWallet(panelFor('Wallet', 'wallet'), {
      onBalance: (account) => {
          held = account ? Number(account.amount) : null;
          hud.stat('credits', held === null ? '—' : held.toFixed(2));
          profile?.refresh();
      },
  });
  const showCredits = () => wallet.refresh();

  showCredits();

  const build = mountBuild(panelFor('Place', 'build'), {
    app, pc, api, camera, origin, terrain, streamer, player, work, preview,
    canvas: view, nearby, wallet,
  });

  // SPEC §2.4 "Get land": somebody with none is told who hands it out, and
  // given the one thing they can do about it. Mounted before the list, so the
  // list's first refresh has something to hand its areas to.
  const getland = mountGetLand(hud.panel('Your land'));

  // T5: the land you own, outlined in the world and listed in the panel, with
  // what stands on it. Going to something puts you in front of it.
  const land = mountLand(hud.panel('Your land'), {
      onGo: (item) => {
          const p = origin.localOf({ lon: item.lon, lat: item.lat, h: item.h ?? 0 });
          player.position = { x: p.x, y: p.y + 2, z: p.z + 8 };
      },
      onAreas: (areas) => { landChanged(areas); getland.refresh(areas); },
      openPanel: (name) => hud.show(name),
      onRemove: (item) => api.remove('instance', { id: `eq.${item.id}` })
          .then(() => build.refresh()),
  });

  // SPEC §2.16: Automate is a workspace of its own rather than a panel, so it
  // takes the window and the world stops being drawn under it. litegraph is
  // fetched the first time it is opened, not now (client/flow/boot.js).
  const flows = mountFlows(document, {
      lands: () => api.rpc('my_areas').catch(() => []),
      onOpen: () => { paused = true; app.autoRender = false; },
      onClose: () => {
          paused = false;
          app.autoRender = true;
          if (hud.app() === 'Automate') hud.app('Build');
      },
      onStay: () => { if (hud.app() !== 'Automate') hud.app('Automate'); },
  });
  hud.onApp((name) => { if (name === 'Automate') flows.show(); else flows.close(); });

  // Design 5e: who you are in the world, and what that comes to. It reads what
  // the other panels already know, so it holds no state of its own.
  profile = mountProfile(hud.panel('Profile'), {
      claims: () => api.claims(),
      balance: () => held,
      lands: () => land.areas() ?? [],
      things: () => land.things?.() ?? [],
      open: (name) => hud.show(name),
  });
  hud.whenShown('Profile', () => profile.refresh());

  // Whether the tile under a thing has been published with it inside. The
  // streamer already holds every tile row; `dirty` is the world's own answer.
  const unrendered = (row) => {
    if (row.placing) return false;
    for (let i = tm.ZOOMS.length - 1; i >= 0; i--) {
      const z = tm.ZOOMS[i];
      const t = streamer.tiles.get(`${z}/${tm.tileX(row.lon, z)}/${tm.tileY(row.lat, z)}`);
      if (t) return Boolean(t.dirty) || !(t.published_version > 0);
    }
    return true;
  };

  // What Submit and Permission last counted, which is what the next-step card
  // needs and neither panel has to be open for.
  let lastCount = null;
  let lastWaiting = 0;

  // T6: what you built has to be compiled before anybody else can see it.
  // Submit puts your tiles in a public pool at a price; the pool is where
  // anybody's tab takes them.
  const submit = mountSubmit(hud.panel('Submit'), {
      // Something was sent for a decision: the person who decides may be this
      // same player, and the panel that shows it is one tab away.
      onSubmitted: () => { pool.refresh(); land.refresh(); permission.refresh(); },
      onCount: (p) => {
          // The route through the app, as the chrome shows it. Every number
          // is one area_progress already reports; none is invented here.
          lastCount = p;
          hud.stat('placed', String(land.things?.().length ?? 0));
          hud.stat('pool', `${p.open_jobs ?? 0} tiles`);
          // The tiles this land is compiled into, not every tile whose box
          // overlaps it: the z6 one over a Valais hillside is six hundred
          // kilometres across and belongs to everybody, and counting it among
          // a half-hectare's twenty-two read as "you own twenty-two tiles"
          // (db/0087).
          hud.stat('rendered', `${p.leaves_published ?? 0} / ${p.leaves ?? 0}`);
          hud.stat('published', String(p.leaves_published ?? 0));
          // A tile exists where something stands, so this is how many things
          // are on the land that is chosen in the panel — nothing, and there is
          // nothing to submit however much land you own.
          onMyLand = p.leaves;
      },
  });
  // The pool is a queue other tabs are taking work out of, so what it showed
  // when the page loaded is not what is in it now: opening the tab asks again.
  const pool = mountPool(hud.panel('Render jobs'), {
      loop: () => work.ready(),
      where: () => {
          const p = camera.getPosition();
          return origin.geodeticOf({ x: p.x, y: p.y, z: p.z });
      },
  });

  // Opening a tab is asking what is there now. The world changes outside this
  // page — somebody draws in QGIS, somebody else's tab renders a tile — and a
  // panel that answers from what it knew at load time tells the player that
  // nothing has changed since they last sent it, which is the one thing they
  // know to be untrue.
  hud.whenShown('Render jobs', () => pool.refresh());
  hud.whenShown('Your land', () => land.refresh());
  hud.whenShown('Submit', () => submit.refresh());

  // T7: what has been rendered on your land and is waiting for you to say yes.
  // The switch shows the waiting version in place; approving publishes it for
  // everybody, refusing leaves what was there and sends a note back.
  const permission = mountPermission(hud.panel('Permission'), {
      preview,
      // SPEC §2.9: Review flies you there — to the ground, looking at what was
      // built. Sixty metres above it, which is where this used to land you, is
      // a place from which you cannot see what you are being asked about.
      onGo: (centre) => {
          if (centre.lon === undefined) return;
          const p = origin.localOf({ lon: centre.lon, lat: centre.lat, h: 0 });
          player.position = { x: p.x, y: (terrain.heightAt(p) ?? p.y) + 2, z: p.z + 12 };
          player.yaw = 0;
      },
      where: () => {
          const p = camera.getPosition();
          return origin.geodeticOf({ x: p.x, y: p.y, z: p.z });
      },
      onDecided: () => { land.refresh(); submit.refresh(); },
      onCount: (n) => {
          lastWaiting = n;
          hud.badge('Permission', n);
          hud.stat('awaiting', String(n));
      },
  });

  hud.whenShown('Permission', () => permission.refresh());

  // SPEC §2.3: the map's search box. A name is how you find a place somebody
  // told you about without a link to it.
  mountPlaces(hud.mapBox(), { onGo: (place) => goTo(place) });

  // T8: the link, to hand to somebody.
  const share = mountShare(hud.panel('Share'), {
      where: () => {
          const p = camera.getPosition();
          return { ...origin.geodeticOf({ x: p.x, y: p.y, z: p.z }),
              heading: player.heading };
      },
  });

  // WP4.3's grants and proposals live in the Your land panel itself now
  // (design 3b): one card per area, with the people on it and what is waiting
  // for a decision. The old module stays mounted for the one thing the card
  // does not do — merging a proposal — in a tab of its own under Permission,
  // where deciding already happens.
  const areas = mountAreas(panelFor('Permission', 'areas'), {
    onSelect: () => { build.refresh(); land.refresh(); },
  });

  // Where the last area_at was asked, so it is asked again only when the player
  // has walked somewhere else — or when who they are changes, below.
  let asked = { lon: 0, lat: 0, at: 0 };

  // …or when the land itself changes under them. Giving a piece of land back
  // (story 11) leaves you standing exactly where you were, so nothing about
  // the camera says the answer is stale — but the line under you was naming
  // land that no longer exists.
  let lands = '';
  let landStale = false;
  function landChanged(areas) {
      const now = (areas ?? []).map((a) => a.id).sort().join(',');
      if (now === lands) return;
      lands = now;
      landStale = true;
  }

  mountAuth(setup.account, {
    onChange: () => {
        // Who you are changes what the land under you says, and the answer is
        // cached until you walk somewhere else — so forget it.
        asked = { lon: 0, lat: 0, at: 0 };
        build.refresh(); areas.refresh(); showCredits();
        catalog.refresh(); admin.refresh(); rules.refresh(); setup.refresh();
        land.refresh(); assignLand.refresh(); attention.refresh();
        submit.refresh(); pool.refresh(); permission.refresh();
        showWho();
    },
  });

  // The player drives the camera unless something else has taken the wheel —
  // the streaming tests script the camera directly.
  let driving = true;
  const setDriving = (v) => { driving = v; };

  // WP5.4 — the headset. The rig is made only when a session starts: outside
  // one the camera is exactly where it was, and every other test in this repo
  // flies it the same way it always did. In a session the pose drives the
  // camera, so locomotion moves the rig under it and the player loop stands
  // down. Teleport is the only locomotion offered — smooth motion in a headset
  // is what makes people sick.
  //
  // Not run on a headset: there is none here. docs/xr.md says what to check.
  const xrPanel = panelFor('Setup', 'xr');
  xrPanel.hidden = true;
  xrPanel.innerHTML = '<button type="button" class="xr-enter">enter VR</button>'
      + ' <span class="xr-status muted"></span>';
  let rig = null;
  async function offerXr() {
    if (!wantsXr) return;
    xrPanel.hidden = false;
    const status = xrPanel.querySelector('.xr-status');
    const ok = await xrSupported() && app.xr?.isAvailable(pc.XRTYPE_VR);
    if (!ok) {
      xrPanel.querySelector('.xr-enter').disabled = true;
      status.textContent = 'no headset on this browser';
      return;
    }
    status.textContent = `${XR_LIMITS.splats / 1e6} M splat budget`;
    xrPanel.querySelector('.xr-enter').onclick = () => {
      rig = rig ?? new pc.Entity('xr-rig');
      if (!rig.parent) app.root.addChild(rig);
      const p = camera.getPosition().clone();
      camera.reparent(rig);
      camera.setLocalPosition(0, 0, 0);
      rig.setPosition(p);
      setDriving(false);
      app.xr.start(camera.camera, pc.XRTYPE_VR, pc.XRSPACE_LOCALFLOOR, {
        callback: (err) => { if (err) status.textContent = String(err.message ?? err); },
      });
    };
    app.xr.on('end', () => { setDriving(true); status.textContent = 'left VR'; });
    // A trigger pull is a teleport: where the controller points, if that is
    // ground this tab has actually streamed.
    app.xr.input?.on('select', (source) => {
      const o = source.getOrigin();
      const d = source.getDirection();
      const to = teleportTarget(terrain, { x: o.x, y: o.y, z: o.z },
        { x: d.x, y: d.y, z: d.z });
      if (!to) { status.textContent = 'no ground there'; return; }
      rig.setPosition(to.x, to.y - camera.getLocalPosition().y, to.z);
      player.position = { x: to.x, y: to.y, z: to.z };
    });
  }
  offerXr();

  // The address bar says where you are, so copying it out of the browser is the
  // same as the Share panel's button. Twice a second at most: it is a string,
  // but replaceState on every frame is not free and fills nothing useful.
  function keepTheAddressBar(where) {
      // A world with no ground has no places in it; a link to one is a link to
      // nowhere.
      if (!ground?.coverage) return;
      if (Date.now() < stampAfter) return;
      stampAfter = Date.now() + 2000;
      history.replaceState(null, '', visitHash(where));
      share.refresh();
  }

  // The land under the player, and whether they may build on it. area_at is a
  // spatial question no filter can ask, so it is asked when the ground changes
  // rather than every frame.
  function whereAmI(g) {
      // Asked again when the player has walked somewhere else or the land
      // itself changed — and, either way, at least every few seconds. An
      // answer can be thrown away (a newer question was already in the air) or
      // never arrive, and a line that is only re-asked when the camera moves
      // then keeps the wrong name under somebody who is standing still.
      const moved = !sameSpot(g, asked);
      const fresh = moved || landStale;
      if (Date.now() - asked.at < (fresh ? 2000 : 5000)) return;
      landStale = false;
      asked = { lon: g.lon, lat: g.lat, at: Date.now() };
      // Where this answer is about. Two questions are in the air whenever the
      // player is still arriving somewhere, and the older one landing last put
      // the wrong land's name under them — so an answer is used only while the
      // player is still where it was asked about. Not the question's identity:
      // the periodic re-ask asks about the same spot, and under load the
      // answers were taking longer than the interval, so every one of them was
      // thrown away by the next and the line never changed at all.
      const mine = { lon: g.lon, lat: g.lat };
      // Outside the coverage there is no world at all, which is a different
      // thing from ground nobody has claimed (T1).
      if (ground?.coverage && (g.lon < ground.west || g.lon > ground.east
          || g.lat < ground.south || g.lat > ground.north)) {
          hud.standing({ land: 'off the edge of the world', owner: '',
              right: `outside ${ground.coverage}`, may: false });
          return;
      }
      // The Place panel answers "may I build here"; the answer changes when
      // you walk somewhere else — not when this is only the periodic re-ask,
      // which is several requests for an answer nothing has changed.
      if (fresh) build.refresh();
      api.rpc('area_at', { lon: g.lon, lat: g.lat }).then((areas) => {
          if (!sameSpot(asked, mine)) return;
          const a = areas?.[0];
          // SPEC §2.4: the land you are standing on has a card whoever's it
          // is, and §3.11 is asked for from that card.
          land.standingOn(a ?? null);
          if (!a) {
              hud.standing({ land: 'unclaimed ground', owner: '',
                  right: 'nobody owns this', may: false });
              return;
          }
          hud.standing({
              land: a.name || 'unnamed land',
              owner: a.mine ? 'you' : (a.owner ?? ''),
              right: a.may_write ? 'you may build here'
                  : a.may_propose ? 'you may propose here' : 'read only',
              may: Boolean(a.may_write),
          });
      }).catch(() => { landStale = true; });
  }

  let onMyLand = null;

  // What is missing, and what to do about it. The sentence is for a world
  // that is not set up yet — no ground, no land — because until then there is
  // no route to be on. Once there is land, the card (design 3a) says which of
  // the four steps that land is on and opens the panel that does the next one.
  const nextStep = mountNextStep(document.getElementById('hud'), {
      open: (name) => hud.show(name),
  });

  function sayWhatIsMissing() {
      const areas = land.areas() ?? [];
      const published = [...streamer.tiles.values()]
          .filter((t) => t.published_version > 0).length;
      const missing = whatIsMissing({
          coverage: ground?.coverage,
          areas: areas.length,
          mine: areas.filter((a) => a.mine).length,
          things: onMyLand,
          published,
      });
      // Both would be shouting the same thing at once.
      const onTheRoute = areas.some((a) => a.mine) && ground?.coverage;
      // SPEC §3.12: the elevation service stopping is said where the player
      // is, over everything else — it is the ground under them — and the page
      // goes on drawing what it already has. It clears itself: the ground asks
      // again every few seconds, and says nothing once a tile arrives.
      // SPEC §3.12: what went wrong, in the words the server used, and that
      // the page has not given up — floor.js asks again every ten seconds and
      // the line clears itself the moment a tile arrives.
      const trouble = floor?.trouble
          ? `The elevation service is not answering \u2014 ${floor.trouble}`
            + '\nTrying again every few seconds.'
          : '';
      if (Date.now() < arrival.until) hud.notice(arrival.text);
      else hud.notice(trouble || (onTheRoute ? '' : missing));
      const mine = areas.find((a) => a.mine) ?? areas[0];
      nextStep.show({
          things: (land.things?.() ?? []).length,
          changed: Math.max(0, (lastCount?.waiting ?? 0) - (lastCount?.open_jobs ?? 0)),
          open: lastCount?.open_jobs ?? 0,
          waiting: lastWaiting,
          published,
      }, onTheRoute ? (mine?.rules?.name || 'your land') : null);
  }
  setInterval(sayWhatIsMissing, 5000);
  sayWhatIsMissing();

  // The map in the corner, on a slow tick: it is a canvas, and nothing on it
  // changes between frames. Your land is drawn from the same outlines the Your
  // land panel lists, so the two cannot disagree.
  function drawTheMap() {
      const p = camera.getPosition();
      const span = drawMinimap(hud.minimap(), {
          areas: (land.areas() ?? []).map((a) => ({
              mine: a.mine, ring: ringsOf(a.outline)[0] ?? null,
          })),
          things: land.things?.() ?? [],
          at: origin.geodeticOf({ x: p.x, y: p.y, z: p.z }),
          heading: player.heading,
          // The same floor the player is standing on, so the map and the
          // window agree about which way the hill goes.
          ground: {
              heightAt: (lon, lat) => {
                  const y = terrain.heightAt(origin.localOf({ lon, lat, h: 0 }));
                  return y === null ? null : origin.geodeticOf({ x: 0, y, z: 0 }).h;
              },
          },
      });
      if (span) hud.mapScale(`Map · ${span} m · M`);
  }
  setInterval(drawTheMap, 1000);
  drawTheMap();

  // SPEC §0.3: a saved object is everybody's to see, whether or not they are
  // building. Build mode syncs the preview itself (it has the unsaved ones
  // too); this is for everybody else, standing there watching somebody else's
  // land change.
  async function showWhatIsAround() {
    if (build.state.on) return;
    const p = camera.getPosition();
    const g = origin.geodeticOf({ x: p.x, y: p.y, z: p.z });
    await preview.sync(await nearby(g.lon, g.lat)).catch(() => {});
  }
  setInterval(showWhatIsAround, 8000);
  showWhatIsAround();

  // The traversal is re-run when the view changes or a load settles, and every
  // tenth frame regardless; on the other frames the streamer only places what
  // has arrived. Camera pose is compared as a string: cheap, and exact.
  let lastPose = '', lastPending = -1, lastHud = '', tick = 0;
  app.on('update', (dt) => {
    // Automate takes the window; nothing is drawn or streamed under it.
    if (paused) return;
    // A smoothed frame time, so one slow frame does not stall background work
    // and one fast one does not let it back in too early.
    frame.ms = frame.ms ? frame.ms * 0.9 + dt * 1000 * 0.1 : dt * 1000;
    if (driving) {
      player.update(dt);
      const q = player.position;
      camera.setPosition(q.x, q.y, q.z);
      camera.setEulerAngles(player.pitch / Math.PI * 180, player.yaw / Math.PI * 180, 0);
    }
    const p = camera.getPosition();
    sky.follow(p);
    const moved = streamer.rebase({ x: p.x, y: p.y, z: p.z });
    if (moved) {
      camera.setPosition(moved.x, moved.y, moved.z);
      if (driving) player.position = { ...moved };
      preview.rebased();
      groundMesh?.rebased();
    }
    groundMesh?.update(camera.getPosition());
    build.drawGizmo();
    drawAreas({ pc, app, origin, terrain }, land.areas());
    const labels = document.getElementById('world-labels');
    labelAreas({ pc, app, origin, terrain }, land.areas(), labels);
    // SPEC §0.3: a saved object is everybody's to see, marked "not yet
    // rendered" until its tile is published with it inside. A dirty tile is
    // exactly "something here changed since the last publish".
    labelObjects({ pc, app, origin, terrain },
        [...preview.rows.values()].filter(unrendered), labels);
    const r = camera.getRotation();
    const pose = `${p.x.toFixed(1)} ${p.y.toFixed(1)} ${p.z.toFixed(1)} `
      + `${r.x.toFixed(3)} ${r.y.toFixed(3)} ${r.z.toFixed(3)} ${r.w.toFixed(3)}`;
    tick++;
    if (pose !== lastPose || streamer.pending !== lastPending || tick % 10 === 0) {
      lastPose = pose;
      streamer.update(cameraState(camera, app.graphicsDevice.height, pc));
      lastPending = streamer.pending;
    } else {
      streamer.placeNext();
    }
    // Where you are, in the chrome: the compass follows the camera, the
    // coordinates are the real ones, and the land under you is asked for only
    // when you have actually walked somewhere else.
    const here = origin.geodeticOf({ x: p.x, y: p.y, z: p.z });
    const heading = player.heading;
    hud.at(here.lon, here.lat, here.h, heading);
    // The altimeter: how high you are above the sea, and how far that is above
    // whatever is under you. The ground comes from the same heightfield walking
    // stands on, so the two never disagree; null where nothing has loaded.
    const under = terrain.heightAt({ x: p.x, y: p.y, z: p.z });
    hud.height({
        altitude: here.h,
        above: under === null ? null : p.y - under,
        pitch: player.pitch / Math.PI * 180,
    });
    whereAmI(here);
    keepTheAddressBar({ ...here, heading });
    const status = `${live.length} published tiles — ${device.deviceType}\n`
      + `${streamer.entries.size} loaded, ${streamer.pending} loading\n`
      + `${origin.rebases} rebases, ${streamer.swaps} swaps — ${player.mode}`
      + `${player.grounded ? '' : ' (no ground yet)'}`;
    if (status !== lastHud) world.textContent = lastHud = status;
  });
  app.start();

  // The handle the browser tests fly.
  window.splatworld = {
    app, pc, api, origin, streamer, camera, rows, terrain, player, setDriving, work, groundMesh,
    hud, setup, admin, rules, catalog, land, submit, pool, permission, ground,
    share, goTo,
    spot, build, preview, nearby, areas, wallet, flows, xr: { wants: wantsXr, rig: () => rig },
  };
</script>
