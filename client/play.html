<!doctype html>
<meta charset="utf-8">
<title>splatworld</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Endpoints, so the same static files run against compose or a dev box. -->
<meta name="splatworld:api" content="http://localhost:3000">
<meta name="splatworld:files" content="http://localhost:8080">
<style>
  :root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; }
  body { margin: 0; background: #0d1013; color: #e6e9ec; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 12px; left: 12px; width: 20rem; padding: 12px 14px;
    background: #161b20e6; border: 1px solid #2a3138; border-radius: 6px;
  }
  h1 { margin: 0 0 8px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  label { display: block; margin: 6px 0; }
  input { width: 100%; box-sizing: border-box; padding: 4px 6px;
    background: #0d1013; color: inherit; border: 1px solid #2a3138; border-radius: 4px; }
  .auth-buttons { display: flex; gap: 6px; margin-top: 8px; }
  button { flex: 1; padding: 5px 8px; background: #222a31; color: inherit;
    border: 1px solid #39424b; border-radius: 4px; cursor: pointer; }
  button:hover { background: #2b343d; }
  .auth-who { display: flex; gap: 8px; align-items: baseline; }
  .auth-role, #world { color: #8b959e; }
  .auth-status { margin: 6px 0 0; min-height: 1.2em; color: #8b959e; }
  .auth-status[data-bad="1"] { color: #e2867a; }
  #world { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid #2a3138;
    white-space: pre-line; }
  #work { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid #2a3138; }
  .work-gpu, .work-state { color: #8b959e; }
  .work-bg { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .work-bg input { width: auto; }
  .work-tiles { margin: 6px 0; padding: 0; list-style: none; max-height: 8rem;
    overflow-y: auto; }
  .work-tile { display: flex; gap: 6px; align-items: baseline; margin: 2px 0; }
  .work-tile button { flex: 0 0 auto; padding: 1px 6px; }
  .work-log { margin: 4px 0 0; color: #6f7a84; font-size: 12px;
    white-space: pre-wrap; }
</style>

<canvas id="view"></canvas>
<section id="hud">
  <h1>splatworld</h1>
  <div id="auth"></div>
  <p id="world">…</p>
  <div id="work"></div>
</section>

<!-- PlayCanvas 2.x, pinned. The browser tests route this URL to the copy
     `make vendor` puts under client/vendor/, so they run without a network. -->
<script src="https://code.playcanvas.com/playcanvas-2.22.0.js"></script>

<script type="module">
  import * as api from './js/api.js';
  import { mountAuth } from './js/auth.js';
  import { FloatingOrigin } from './js/origin.js';
  import { TileStreamer, cameraState } from './js/tiles.js';
  import { Player, Terrain, WALK } from './js/player.js';
  import { mountWork } from './js/workui.js';
  import { SpotChecker } from './js/spot.js';

  api.configure();
  const world = document.getElementById('world');

  // The work panel lists the dirty tiles of whoever is signed in, so it is
  // re-read every time that changes.
  const work = mountWork(document.getElementById('work'));
  mountAuth(document.getElementById('auth'), { onChange: () => work.refresh() });

  // Reading tiles needs no token: everyone reads the world (db/0003_rls.sql).
  // Every row is fetched, not only the published ones — the traversal has to
  // tell an unpublished child from one that does not exist.
  const rows = await api.select('tile', {
    select: 'z,x,y,dirty,published_version,sog_sha256,manifest',
    order: 'z,x,y', limit: '5000',
  }).catch((err) => {
    world.textContent = `api unreachable (${api.endpoints().api}): ${err.message}`;
    return [];
  });

  const live = rows.filter((r) => r.published_version > 0 && r.manifest?.origin);
  const anchor = (live.find((r) => r.z === 10) ?? live[0])?.manifest.origin
    ?? { lon: 0, lat: 0, h: 0 };
  const origin = new FloatingOrigin(anchor);

  const app = new pc.Application(document.getElementById('view'), {
    graphicsDeviceOptions: { antialias: false },
  });
  app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
  app.setCanvasResolution(pc.RESOLUTION_AUTO);

  const camera = new pc.Entity('camera');
  camera.addComponent('camera', {
    fov: 45, nearClip: 1, farClip: 5e7,
    clearColor: new pc.Color(0.05, 0.06, 0.07),
  });
  camera.setPosition(0, 2000, 0);
  camera.setEulerAngles(-90, 0, 0);            // straight down; WP1.4 takes over
  app.root.addChild(camera);

  // WP1.5: the loaded tiles are re-checked every 30 s. PostgREST takes the set
  // as one `or=(and(z.eq..,x.eq..,y.eq..), ...)` filter, so it is one request
  // however many tiles are on screen.
  const fetchRows = (loaded) => api.select('tile', {
    select: 'z,x,y,published_version,sog_sha256,manifest',
    or: `(${loaded.map((t) => `and(z.eq.${t.z},x.eq.${t.x},y.eq.${t.y})`).join(',')})`,
  });

  const streamer = new TileStreamer(app, pc, {
    origin, filesUrl: api.endpoints().files, fetchRows,
  });
  streamer.setTiles(rows);
  streamer.startPolling();

  // WP3.3: the tab re-checks the tiles it is looking at but did not publish.
  // It sweeps whether or not anyone is signed in — spot_due answers nothing to
  // an anonymous tab — and never while the work panel has an atom in hand.
  const spot = new SpotChecker({
    api, apiUrl: api.endpoints().api, filesUrl: api.endpoints().files, log: work.log,
  });
  spot.start(streamer, { busy: () => Boolean(work.loop()?.atom) });

  const terrain = new Terrain(streamer);
  const player = new Player(terrain, { mode: WALK });
  player.attach(document.getElementById('view'));

  // The player drives the camera unless something else has taken the wheel —
  // the streaming tests script the camera directly.
  let driving = true;
  const setDriving = (v) => { driving = v; };

  app.on('update', (dt) => {
    if (driving) {
      player.update(dt);
      const q = player.position;
      camera.setPosition(q.x, q.y, q.z);
      camera.setEulerAngles(player.pitch / Math.PI * 180, player.yaw / Math.PI * 180, 0);
    }
    const p = camera.getPosition();
    const moved = streamer.rebase({ x: p.x, y: p.y, z: p.z });
    if (moved) {
      camera.setPosition(moved.x, moved.y, moved.z);
      if (driving) player.position = { ...moved };
    }
    streamer.update(cameraState(camera, app.graphicsDevice.height));
    world.textContent = `${live.length} published tiles\n`
      + `${streamer.entries.size} loaded, ${streamer.pending} loading\n`
      + `${origin.rebases} rebases, ${streamer.swaps} swaps — ${player.mode}`
      + `${player.grounded ? '' : ' (no ground yet)'}`;
  });
  app.start();

  // The handle the browser tests fly.
  window.splatworld = {
    app, pc, api, origin, streamer, camera, rows, terrain, player, setDriving, work,
    spot,
  };
</script>
